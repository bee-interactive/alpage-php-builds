name: Auto-Update PHP Versions

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  check-updates:
    name: Check for PHP Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      new_versions: ${{ steps.check.outputs.new_versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare php.net with the latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern VERSIONS --output published.txt 2>/dev/null || touch published.txt
          cat published.txt

          NEW_VERSIONS=""
          for family in 8.1 8.2 8.3 8.4 8.5 8.6; do
            LATEST=$(curl -s "https://www.php.net/releases/index.php?json&version=$family" | jq -r '.version // empty')
            if [ -z "$LATEST" ]; then
              echo "PHP $family: no stable release, skipping"
              continue
            fi

            PUBLISHED=$(awk -v f="$family" '$1 == f { print $2 }' published.txt)
            if [ "$LATEST" != "$PUBLISHED" ]; then
              echo "PHP $family: ${PUBLISHED:-none} → $LATEST"
              NEW_VERSIONS="$NEW_VERSIONS $LATEST"
            else
              echo "PHP $family: $LATEST up to date"
            fi
          done

          if [ -n "$NEW_VERSIONS" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
          echo "new_versions=$NEW_VERSIONS" >> $GITHUB_OUTPUT

  trigger-build:
    name: Trigger Build and Release
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Run Build PHP Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-php.yml --repo ${{ github.repository }} --ref master -f release=true
          echo "::notice::Build triggered for:${{ needs.check-updates.outputs.new_versions }}"
